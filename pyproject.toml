[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nssc"
version = "0.1.0"
description = "Neural State-Space Compiler: automatically compile high-dimensional temporal observations into compact latent dynamical systems"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Sunkalp Chandra", email = "sunkalp.chandra@gmail.com" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "torch>=2.1",
    "pyyaml>=6.0",
    "typer>=0.9",
    "rich>=13.0",
    "matplotlib>=3.7",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov", "ruff>=0.4", "pre-commit"]
dashboard = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
eeg = ["mne>=1.6"]

[project.scripts]
nssc = "nssc.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: slower integration tests (>10s)"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
ignore = ["E501", "B008", "B905", "UP007"]
