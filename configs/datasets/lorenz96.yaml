# Lorenz-96, N=8, F=8 (chaotic). OOD: F=4 quasi-periodic.
system: lorenz96
params: {F: 8.0, N: 8}
n_traj: 100
n_steps: 1000
dt: 0.01
transient: 1000
seed: 0
observation: {type: identity}
noise_std: 0.0
missing_rate: 0.0
split: {fractions: [0.7, 0.15, 0.15], seed: 0}
ood: {param: F, train_range: [7.0, 9.0], test_values: [4.0, 12.0]}
