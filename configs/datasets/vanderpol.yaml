# Van der Pol limit cycle; OOD in mu.
system: vanderpol
params: {mu: 1.0}
n_traj: 100
n_steps: 1000
dt: 0.05
transient: 200
seed: 0
observation: {type: identity}
noise_std: 0.0
missing_rate: 0.0
split: {fractions: [0.7, 0.15, 0.15], seed: 0}
ood: {param: mu, train_range: [0.5, 2.0], test_range: [2.5, 4.0]}
