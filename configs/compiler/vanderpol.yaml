# Van der Pol (μ=1, D=2): limit cycle; expected d=2 and nonlinear dynamics.
_base_: default.yaml
dataset: {_file: configs/datasets/vanderpol.yaml}
candidates:
  latent_dims: [2, 3, 4]
  encoders: [pca, linear, mlp, tcn, gru]
  dynamics: [linear, residual_mlp, koopman, {name: neural_ode, kwargs: {n_substeps: 1}}, ssm]
  hidden_dims: [64]
stages:
  - {name: screen, epochs: 12, seeds: [0], keep_frac: 0.35, score_tolerance: 0.15,
     max_batches_per_epoch: 50,
     eval: {horizons: [1, 5, 10, 25, 50], stability_horizon: 100, latency: false}}
  - {name: fine, epochs: 50, seeds: [0], keep_top: 4}
  - {name: final, epochs: 120, seeds: [0, 1, 2]}
output_dir: results/compile/vanderpol
tags: [compiler, vanderpol]
