# Uncertainty experiment: Gaussian transition dynamics (residual MLP mean + diagonal variance) on Lorenz-63.
# Readouts: calibration (coverage@95, ECE), sharpness, std/error correlation along the horizon.
dataset: {_file: configs/datasets/lorenz63.yaml}
model:
  latent_dim: 3
  encoder: {name: mlp, kwargs: {hidden_dims: [64, 64]}}
  decoder: {name: mlp, kwargs: {hidden_dims: [64, 64]}}
  dynamics: {name: gaussian, kwargs: {base: residual_mlp, base_kwargs: {hidden_dims: [64, 64]}}}
windows: {context: 20, horizon: 40, stride: 5, batch_size: 64}
training: {epochs: 60, lr: 0.002, rollout_horizon: 20, early_stopping_patience: 20, log_every: 10,
           loss: {extra: {latent_nll: 0.1}}}
eval: {context: 20, horizons: [1, 5, 10, 25, 50, 100, 250], stability_horizon: 300}
seed: 0
tags: [uncertainty, lorenz63]
